<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offre Prosecco | Vinova Solutions</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vinova: {
                            navy: '#1A4168',      // Bleu Navy principal du logo
                            navyDark: '#102A45',  // Navy sombre
                            orange: '#E87332',    // Terracotta / Orange du logo
                            orangeLight: '#FFF5EF',
                            orangeHover: '#D66223',
                            bgLight: '#F7FAFC',   
                            cream: '#FCFDFE',
                            border: '#E2E8F0'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS pour les effets d'arrière-plan et cartes -->
    <style>
        .hero-bg {
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(247, 250, 252, 0.80) 100%), 
                              url('https://plus.unsplash.com/premium_photo-1663840297227-08642d8bafb8?q=80&w=687&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .orange-text-gradient {
            background: linear-gradient(135deg, #E87332 0%, #FFA875 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(232, 115, 50, 0.2);
        }
    </style>
</head>
<body class="bg-vinova-cream text-slate-800 font-sans antialiased selection:bg-vinova-orange selection:text-white">

    <!-- ========================================== -->
    <!-- BLOC 1 : MENU DE NAVIGATION FIXE (HEADER)   -->
    <!-- ========================================== -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 text-vinova-navy shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-6">
            
            <nav class="hidden md:flex items-center space-x-8 text-base sm:text-lg font-bold text-vinova-navy">
                <a href="#propos" class="hover:text-vinova-orange transition-colors">À propos</a>
                <a href="#tarifs" class="hover:text-vinova-orange transition-colors">Tarifs & Économies</a>
                <a href="#engagements" class="hover:text-vinova-orange transition-colors">Nos Engagements</a>
                <a href="#calculateur" class="hover:text-vinova-orange transition-colors">Simulateur</a>
            </nav>

            <a href="#devis" class="bg-vinova-orange hover:bg-vinova-orangeHover text-white font-bold px-7 py-3.5 rounded-xl text-base sm:text-lg shadow-lg hover:shadow-vinova-orange/40 transition-all duration-300 hover:scale-105 flex items-center gap-2 shrink-0">
                <span>Demander un Devis</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </a>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- BLOC 2 : SECTION HERO (VITRINE PRINCIPALE) -->
    <!-- ========================================== -->
    <section class="relative min-h-screen pt-28 pb-16 flex items-center justify-center hero-bg text-vinova-navy overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 py-12 grid lg:grid-cols-12 gap-12 items-center">
            
            <!-- Colonne Gauche : Présentation et Offre -->
            <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
                
                <!-- Logo Vinova grand format (Doublé : +100%) -->
                <div class="flex justify-center lg:justify-start mb-2">
                    <img src="VS LOGO 02 fr.png" alt="Vinova Solutions Logo" class="h-32 sm:h-48 lg:h-64 w-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/800x260/transparent/1A4168?text=VINOVA+SOLUTIONS';">
                </div>

                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-vinova-orange/30 bg-vinova-orange/10 text-vinova-orange text-xs font-bold uppercase tracking-wider">
                    <i class="fa-solid fa-wine-glass text-vinova-orange"></i> En provenance directe d'un Producteur Récoltant en Italie
                </div>
                
                <!-- Titre Principal -->
                <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight text-vinova-navy">
                    Super OFFRE <br>
                    <span class="orange-text-gradient">PROSECCO DOC</span>
